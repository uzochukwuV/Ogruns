<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>0G Signal Intelligence Network - Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Decentralized AI Trading Signal Platform powered by 0G">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <!-- Custom Styles -->
  <style>
    :root {
      --theme-color: #0066ff;
      --theme-color-dark: #0052cc;
    }

    .app-name-link img {
      width: 140px;
    }

    .sidebar-nav {
      padding-bottom: 40px;
    }

    .markdown-section code {
      border-radius: 4px;
      font-size: 0.9em;
    }

    .markdown-section pre {
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>

  <script>
    window.$docsify = {
      name: '0G Signal Intelligence',
      repo: 'ogruns/0g-signals',
      loadSidebar: 'SUMMARY.md',
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found.',
        depth: 3
      },

      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },

      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true,
      },

      plugins: [
        function(hook, vm) {
          // Add custom footer
          hook.afterEach(function(html) {
            return html +
              '<hr/>' +
              '<footer style="text-align: center; padding: 20px;">' +
              '<p>Need help? Join our <a href="https://discord.gg/0g-signals" target="_blank">Discord</a></p>' +
              '<p>&copy; 2026 Ogruns. MIT License.</p>' +
              '</footer>';
          });
        }
      ]
    }
  </script>

  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-solidity.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
